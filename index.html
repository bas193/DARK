<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARK STORE OFFICIAL</title>
<style>
:root{--bg:#0A0F1E;--card:#111827;--kuning:#FFC107;--hijau:#22C55E}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:var(--bg);color:#fff}
header{background:linear-gradient(90deg,#FFC107,#FF8C00);padding:20px;text-align:center;color:#000}
header h1{font-size:24px;font-weight:900} header p{font-size:13px;margin-top:5px}
.container{padding:15px;max-width:1100px;margin:auto}
.nav{display:flex;gap:10px;margin:15px 0}
.nav button{flex:1;padding:14px;border:none;border-radius:12px;background:#1E293B;color:#fff;cursor:pointer;font-weight:bold;font-size:15px}
.nav button.active{background:var(--kuning);color:#000}
.filter{display:flex;gap:10px;overflow-x:auto;padding:10px 0}
.btn-kat{padding:10px 18px;border-radius:20px;background:#1E293B;border:none;color:#fff;cursor:pointer;white-space:nowrap;font-weight:600}
.btn-kat.active{background:var(--kuning);color:#000}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.card{background:var(--card);border:1px solid #1E293B;padding:18px;border-radius:16px;text-align:center}
.card .icon{font-size:40px;margin-bottom:8px} .card h3{font-size:16px;margin-bottom:8px}
.harga{color:var(--kuning);font-size:22px;font-weight:bold;margin:8px 0}
.proses{font-size:12px;color:#94A3B8;margin-bottom:12px}
.beli{width:100%;background:var(--hijau);border:none;color:#fff;padding:12px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:14px}
.box{background:var(--card);padding:18px;border-radius:14px;margin-bottom:15px;border:1px solid #1E293B}
.box h3{margin-bottom:12px} 
input,select{width:100%;padding:12px;margin:8px 0;background:#0A0F1E;border:1px solid #334155;border-radius:8px;color:#fff;font-size:14px}
.btn-simpan{width:100%;background:var(--kuning);color:#000;border:none;padding:14px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:15px}
.item-admin{display:flex;justify-content:space-between;align-items:center;padding:10px;background:#0A0F1E;border-radius:8px;margin:8px 0}
.btn-del{background:#EF4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--hijau);padding:12px 20px;border-radius:8px;display:none;z-index:999}
#toast.show{display:block}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<header>
  <h1>⚡ DARK STORE OFFICIAL ⚡</h1>
  <p>Top Up Game & Jual Reach Channel Termurah</p>
</header>

<div class="container">
  <div class="nav">
    <button class="active" onclick="tab('toko',this)">🛒 Kedai</button>
    <button onclick="tab('admin',this)">⚙️ Admin</button>
  </div>

  <div id="toko">
    <div class="filter" id="filter"></div>
    <div class="grid" id="produk"></div>
  </div>

  <div id="admin" style="display:none">
    <div class="box">
      <h3>➕ Tambah Produk Baru</h3>
      <select id="katPilih"></select>
      <input id="namaP" placeholder="Nama Produk - Contoh: 500 Reach">
      <input id="hargaP" placeholder="Harga - Contoh: RM15.00">
      <input id="prosesP" value="1-5 Minit" placeholder="Masa Proses">
      <button class="btn-simpan" onclick="tambahProduk()">SIMPAN PRODUK</button>
    </div>
    <div class="box">
      <h3>📦 Senarai Produk</h3>
      <div id="tabelP">Tiada produk lagi</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const WA = "60194939829";

// DATA DEFAULT BIAR TAK KOSONG
const DATA_DEFAULT = {
  kategori:[
    {id:1,nama:"Reach",icon:"📈"},
    {id:2,nama:"Free Fire",icon:"💎"},
    {id:3,nama:"Mobile Legends",icon:"🛡️"},
    {id:4,nama:"Valorant",icon:"🔫"}
  ],
  produk:[
    {id:1,kat:1,nama:"10 Reach",harga:"RM0.30",proses:"1-3 Minit"},
    {id:2,kat:1,nama:"500 Reach",harga:"RM15.00",proses:"15-30 Minit"},
    {id:3,kat:1,nama:"1000 Reach",harga:"RM28.00",proses:"1 Jam"},
    {id:4,kat:2,nama:"50 Diamond FF",harga:"RM3.50",proses:"1-5 Minit"},
    {id:5,kat:2,nama:"100 Diamond FF",harga:"RM6.50",proses:"1-5 Minit"},
    {id:6,kat:3,nama:"50 Diamond ML",harga:"RM6.00",proses:"1-10 Minit"}
  ]
};

function getData(){
  if(!localStorage.darkstore_v2){
    localStorage.darkstore_v2 = JSON.stringify(DATA_DEFAULT);
  }
  return JSON.parse(localStorage.darkstore_v2);
}
function saveData(d){localStorage.darkstore_v2=JSON.stringify(d)}
const ALERT = (t)=>{toast.innerText=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)}

function tab(nama,el){
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('toko').style.display = nama=='toko'?'block':'none';
  document.getElementById('admin').style.display = nama=='admin'?'block':'none';
  if(nama=='admin') loadAdmin();
}

function loadToko(){
  let db = getData();
  document.getElementById('filter').innerHTML = `<button class="btn-kat active" onclick="filter(0,this)">🔥 Semua</button>` + 
  db.kategori.map(k=>`<button class="btn-kat" onclick="filter(${k.id},this)">${k.icon} ${k.nama}</button>`).join('');
  filter(0, document.querySelector('.btn-kat'))
}

function filter(id,el){
  document.querySelectorAll('.btn-kat').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  let db = getData();
  let list = id==0 ? db.produk : db.produk.filter(p=>p.kat==id);
  
  if(list.length==0){
    document.getElementById('produk').innerHTML = `<p style="text-align:center;color:#94A3B8">Tiada produk dalam kategori ini</p>`
    return
  }
  
  document.getElementById('produk').innerHTML = list.map(p=>{
    let kat = db.kategori.find(k=>k.id==p.kat);
    return `
    <div class="card">
      <div class="icon">${kat.icon}</div>
      <h3>${p.nama}</h3>
      <p class="proses">⚡ Proses: ${p.proses}</p>
      <p class="harga">${p.harga}</p>
      <button class="beli" onclick="order('${p.nama}','${p.harga}','${kat.nama}')">BELI SEKARANG</button>
    </div>`}).join('');
}

function order(nama,harga,kat){
  let msg = `*📦 ORDER BARU - DARK STORE*%0A%0A*Kategori* : ${kat}%0A*Produk* : ${nama}%0A*Harga* : ${harga}%0A%0A*Maklumat Customer*%0ANama Channel/ID : %0ANombor WhatsApp : %0A%0A_Sila balas untuk proses order. Terima Kasih 🙏_`;
  window.open(`https://wa.me/${WA}?text=${msg}`,'_blank');
  ALERT("Redirect ke WhatsApp...");
}

function loadAdmin(){
  let db = getData();
  document.getElementById('katPilih').innerHTML = db.kategori.map(k=>`<option value="${k.id}">${k.icon} ${k.nama}</option>`).join('');
  
  if(db.produk.length==0){
    document.getElementById('tabelP').innerHTML = 'Tiada produk lagi'
  } else {
    document.getElementById('tabelP').innerHTML = db.produk.map((p,i)=>{
      let kat = db.kategori.find(k=>k.id==p.kat);
      return `<div class="item-admin">${i+1}. ${kat.icon} ${p.nama} - ${p.harga} <button class="btn-del" onclick="hapus(${p.id})">HAPUS</button></div>`
    }).join('');
  }
}

function tambahProduk(){
  let k=document.getElementById('katPilih').value,n=document.getElementById('namaP').value,h=document.getElementById('hargaP').value,pr=document.getElementById('prosesP').value;
  if(!n||!h) return ALERT('Lengkapkan Nama & Harga');
  let db=getData();
  db.produk.push({id:Date.now(),kat:+k,nama:n,harga:h,proses:pr});
  saveData(db); ALERT('✅ Produk Berjaya Disimpan');
  document.getElementById('namaP').value='';document.getElementById('hargaP').value=''; 
  loadAdmin(); loadToko();
}

function hapus(id){ 
  if(confirm('Hapus produk ini?')){
    let db=getData();
    db.produk=db.produk.filter(p=>p.id!=id);
    saveData(db);
    ALERT('🗑️ Produk Dihapus');
    loadAdmin();loadToko();
  }
}

loadToko();
</script>
</body>
  </html>
